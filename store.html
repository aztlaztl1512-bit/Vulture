<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر تطبيقات فولتشر 🦅</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --main: #4a4ae2; --danger: #dc3545; --s: #28a745; --bg: #f0f2f5; --txt: #333; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; direction: rtl; }
        
        .header { text-align: center; padding: 10px 0; color: var(--main); position: relative; }
        .header h1 { margin: 10px 0 0 0; font-size: 1.4rem; }
        .back-btn { position: absolute; right: 10px; top: 15px; color: #666; text-decoration: none; font-size: 0.9rem; font-weight: bold; }

        .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; margin-top: 10px; }
        
        .app-card { background: white; border-radius: 20px; padding: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #eee; display: flex; flex-direction: column; transition: 0.3s; }
        .app-card:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0,0,0,0.08); }
        
        .app-top { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; }
        .app-icon { width: 70px; height: 70px; border-radius: 18px; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 2px solid #fff; }
        
        /* تلوين اسم التطبيق باللون الأحمر المطلوب */
        .app-title { font-weight: bold; font-size: 1.2rem; color: var(--danger); flex: 1; text-shadow: 1px 1px 0px rgba(255,255,255,0.8); }

        .app-desc { font-size: 0.85rem; color: #666; line-height: 1.5; margin-bottom: 15px; background: #f9f9f9; padding: 10px; border-radius: 12px; border: 1px solid #f0f0f0; }

        .info-row { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #f0f0f0; padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; transition: 0.2s; }
        .info-row:hover { background: #fbfbfb; border-color: #e0e0e0; }
        .info-label { font-size: 0.75rem; color: #888; font-weight: bold; }
        .info-value { font-size: 0.9rem; font-weight: bold; color: #222; margin-left: 10px; word-break: break-all; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
        
        .copy-btn { color: var(--s); cursor: pointer; transition: 0.2s; padding: 5px; font-size: 1.1rem; }
        .copy-btn:active { transform: scale(1.3); color: var(--main); }

        .btn-download { background: var(--main); color: white; text-align: center; padding: 14px; border-radius: 14px; text-decoration: none; font-weight: bold; margin-top: auto; display: block; font-size: 0.95rem; box-shadow: 0 4px 10px rgba(74, 74, 226, 0.2); transition: 0.3s; }
        .btn-download:hover { background: #3a3abf; box-shadow: 0 6px 15px rgba(74, 74, 226, 0.3); }
    </style>
</head>
<body>

<div class="header">
    <a href="javascript:history.back()" class="back-btn"><i class="fas fa-arrow-right"></i> عودة</a>
    <h1>متجر تطبيقات فولتشر 🦅</h1>
</div>

<div class="app-grid" id="storeContainer">
    </div>

<script>
    const DB_URL = "https://aziztest-a0f6c-default-rtdb.firebaseio.com/.json";

    async function loadStore() {
        try {
            const res = await fetch(DB_URL);
            const data = await res.json();
            const apps = data.apps || [];
            const container = document.getElementById('storeContainer');

            if (apps.length === 0) {
                container.innerHTML = "<p style='text-align:center; width:100%; color:#888; padding: 50px 0;'>لا توجد تطبيقات في المتجر حالياً</p>";
                return;
            }

            container.innerHTML = apps.map((app, i) => `
                <div class="app-card">
                    <div class="app-top">
                        <img src="${app.img || 'https://via.placeholder.com/100'}" class="app-icon" alt="${app.name}">
                        <div class="app-title">${app.name}</div>
                    </div>
                    
                    <div class="app-desc">${app.at || 'لا يوجد وصف متوفر لهذا التطبيق حالياً.'}</div>

                    <div class="info-row">
                        <span class="info-label">كود داونلودر:</span>
                        <span class="info-value" id="code-${i}">${app.ad}</span>
                        <i class="far fa-copy copy-btn" onclick="copyText('code-${i}')" title="نسخ الكود"></i>
                    </div>

                    <div class="info-row">
                        <span class="info-label">الرابط المباشر:</span>
                        <span class="info-value" id="url-${i}">${app.al}</span>
                        <i class="far fa-copy copy-btn" onclick="copyText('url-${i}', '${app.al}')" title="نسخ الرابط"></i>
                    </div>

                    <a href="${app.al}" target="_blank" class="btn-download">
                        <i class="fas fa-cloud-download-alt"></i> تحميل الآن
                    </a>
                </div>
            `).join('');
        } catch (e) {
            container.innerHTML = "<p style='text-align:center; width:100%; color:red; padding: 50px 0;'>حدث خطأ أثناء جلب البيانات</p>";
        }
    }

    function copyText(id, fullText = null) {
        const text = fullText ? fullText : document.getElementById(id).innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert("تم نسخ البيانات بنجاح!");
        });
    }

    loadStore();
</script>
</body>
</html>
